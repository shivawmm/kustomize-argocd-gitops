apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: weather-dashboard-ingress
  namespace: kustomize-argocd-demo

spec:
  ingressClassName: nginx

  rules:
    - host: weather-dashboard.local

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: weather-dashboard-service

                port:
                  number: 80