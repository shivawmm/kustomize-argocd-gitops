apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: weather-dashboard-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/shivawmm/kustomize-argocd-gitops.git

    targetRevision: main

    path: overlays/prod

  destination:
    server: https://kubernetes.default.svc

    namespace: kustomize-argocd-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true